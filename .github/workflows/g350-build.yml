name: CozOS G350 cloud build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - knulli-main
    paths:
      - .github/workflows/g350-build.yml

permissions:
  contents: read

concurrency:
  group: cozos-g350-build
  cancel-in-progress: true

jobs:
  build-g350:
    name: Build G350 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force --volumes
          df -h /

      - name: Check out CozOS and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_NAME}"
            docker --version
            df -h /
            free -h
          } | tee cozos-g350-build-metadata.txt

      - name: Build KNULLI build environment
        shell: bash
        run: |
          set -euo pipefail
          make build-docker-image
          docker image ls knulli/knulli-build
          df -h /

      - name: Verify and repair upstream Armbian firmware hash
        shell: bash
        run: |
          set -euo pipefail
          version="f80f5986fbc49ab91fe4342fd896fbd47e851e25"
          archive="dl/armbian-firmware/armbian-firmware-${version}-git4.tar.gz"
          hash_file="buildroot/package/armbian-firmware/armbian-firmware.hash"

          # KNULLI updated the pinned commit but left only the previous archive
          # hash in Buildroot. Generate the archive with Buildroot's own git
          # backend, verify the immutable commit, then add its calculated hash.
          set +e
          make rk3326-build \
            BATCH_MODE=1 \
            EXTRA_OPTS='BR2_TARGET_KNULLI_IMAGES=\"rockchip/rk3326/g350\" BR2_PACKAGE_FFMPEG_EXTRACONF=\"--disable-libx265\"' \
            CMD=armbian-firmware-source
          probe_status=$?
          set -e

          test -f "${archive}"
          test "$(git --git-dir=dl/armbian-firmware/git/.git rev-parse HEAD)" = "${version}"

          digest="$(sha256sum "${archive}" | awk '{print $1}')"
          test -n "${digest}"
          if ! grep -Fq "  ${archive##*/}" "${hash_file}"; then
            printf 'sha256  %s  %s\n' "${digest}" "${archive##*/}" >> "${hash_file}"
          fi
          grep -F "  ${archive##*/}" "${hash_file}"
          printf 'armbian_firmware_sha256=%s\n' "${digest}" | tee -a cozos-g350-build-metadata.txt
          printf 'Initial source probe exit status: %s (expected nonzero while the hash is absent)\n' "${probe_status}"

      - name: Prefetch verified RK3326 Mali firmware
        shell: bash
        run: |
          set -euo pipefail
          filename="rk3326_r13p0_gbm_with_vulkan_and_cl.zip"
          destination="dl/mali-g31-gbm/${filename}"
          source_7z="${RUNNER_TEMP}/rk3326-mali.7z"
          extract_dir="${RUNNER_TEMP}/rk3326-mali"
          mirror_commit="daf063fc503be035a3df68ad59209ee62c57cfc9"
          mirror_blob="2988b004dd19e2c06e0259fdd3819bab9c6ca8f7"
          hash_file="batocera/package/batocera/gpu/mali-g31-gbm/mali-g31-gbm.hash"

          # Hardkernel's CDN rejects GitHub-hosted runners. Use ArkOS's
          # established GitHub mirror pinned to an immutable commit and verify
          # the exact Git blob before repacking the same two driver binaries.
          curl --location --fail-with-body --retry 5 --retry-all-errors \
            --output "${source_7z}" \
            "https://raw.githubusercontent.com/christianhaitian/linux/${mirror_commit}/video_drivers/rk3326_r13p0_gbm_with_vulkan_and_cl.7z"
          test "$(git hash-object "${source_7z}")" = "${mirror_blob}"

          rm -rf "${extract_dir}"
          mkdir -p "${extract_dir}" "$(dirname "${destination}")"
          7z e -y -o"${extract_dir}" "${source_7z}" \
            rk3326_r13p0_gbm_with_vulkan_and_cl/libmali.so_rk3326_gbm_arm64_r13p0_with_vulkan_and_cl \
            rk3326_r13p0_gbm_with_vulkan_and_cl/libmali.so_rk3326_gbm_arm32_r13p0_with_vulkan_and_cl
          test -s "${extract_dir}/libmali.so_rk3326_gbm_arm64_r13p0_with_vulkan_and_cl"
          test -s "${extract_dir}/libmali.so_rk3326_gbm_arm32_r13p0_with_vulkan_and_cl"

          rm -f "${destination}"
          (
            cd "${extract_dir}"
            zip -9 "${GITHUB_WORKSPACE}/${destination}" \
              libmali.so_rk3326_gbm_arm64_r13p0_with_vulkan_and_cl \
              libmali.so_rk3326_gbm_arm32_r13p0_with_vulkan_and_cl
          )
          digest="$(sha256sum "${destination}" | awk '{print $1}')"
          sed -i -E "s|^sha256[[:space:]]+[0-9a-f]+[[:space:]]+${filename}$|sha256 ${digest} ${filename}|" "${hash_file}"
          grep -F " ${filename}" "${hash_file}"
          sha256sum "${destination}" \
            "${extract_dir}/libmali.so_rk3326_gbm_arm64_r13p0_with_vulkan_and_cl" \
            "${extract_dir}/libmali.so_rk3326_gbm_arm32_r13p0_with_vulkan_and_cl" \
            | tee -a cozos-g350-build-metadata.txt

      - name: Prefetch verified Libtool source
        shell: bash
        run: |
          set -euo pipefail
          filename="libtool-2.4.7.tar.xz"
          mkdir -p dl/libtool
          curl --location --fail --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output "dl/libtool/${filename}" \
            "https://ftp.gnu.org/gnu/libtool/${filename}"
          digest="$(awk -v name="${filename}" '$1 == "sha256" && $3 == name {print $2}' buildroot/package/libtool/libtool.hash)"
          test "${#digest}" -eq 64
          printf '%s  %s\n' "${digest}" "dl/libtool/${filename}" | sha256sum --check -

      - name: Check controller and FFmpeg, then build G350 image
        shell: bash
        run: |
          set +e
          set -uo pipefail
          compile_log="cozos-g350-compile.log"
          # Omit optional x265 encoding; native HEVC decoding is retained.
          # Check the controller and FFmpeg before building all emulators.
          # Buildroot builds the toolchain and kernel prerequisites first.
          # Reuse those outputs for the full image only if the driver passes.
          build_status=0
          for target in rocknix-joypad ffmpeg-configure all; do
            echo "::group::Build target: ${target}"
            make rk3326-build \
              BATCH_MODE=1 \
              PARALLEL_BUILD=1 \
              MAKE_JLEVEL="$(nproc)" \
              EXTRA_OPTS='BR2_TARGET_KNULLI_IMAGES=\"rockchip/rk3326/g350\" BR2_PACKAGE_FFMPEG_EXTRACONF=\"--disable-libx265\"' \
              CMD="${target}" \
              2>&1 | tee -a "${compile_log}"
            pipeline_status=("${PIPESTATUS[@]}")
            build_status=${pipeline_status[0]}
            if [ "${build_status}" -eq 0 ]; then
              build_status=${pipeline_status[1]}
            fi
            echo "::endgroup::"
            if [ "${build_status}" -ne 0 ]; then
              break
            fi
          done

          if [ "${build_status}" -ne 0 ]; then
            tail -n 300 "${compile_log}" > cozos-g350-error-tail.txt
            gzip -9 -c "${compile_log}" > cozos-g350-compile.log.gz
            {
              echo "## G350 build failure"
              echo
              echo '~~~text'
              tail -n 120 cozos-g350-error-tail.txt
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit "${build_status}"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CozOS-G350-build-diagnostics-${{ github.sha }}
          path: |
            cozos-g350-error-tail.txt
            cozos-g350-compile.log.gz
            cozos-g350-build-metadata.txt
            output/rk3326/.config
            output/rk3326/build/**/config.log
            output/rk3326/build/**/CMakeCache.txt
            output/rk3326/build/**/CMakeError.log
            output/rk3326/host/**/x265.pc
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Verify output
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          image="$(find output/rk3326/images/knulli/images/g350 -maxdepth 1 -type f -name '*.img.gz' -print | sort | tail -n 1)"
          test -n "${image}"
          sha256sum "${image}" | tee "${image}.sha256"
          mkdir -p cozos-g350-artifact
          cp "${image}" "${image}.sha256" cozos-g350-build-metadata.txt cozos-g350-artifact/
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          ls -lh cozos-g350-artifact
          df -h /

      - name: Upload flashable firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CozOS-G350-${{ github.sha }}
          path: cozos-g350-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
