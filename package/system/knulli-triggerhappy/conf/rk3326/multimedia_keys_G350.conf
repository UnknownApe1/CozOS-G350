# BATLEXP G350 hardware keys
KEY_VOLUMEUP 1                           /usr/bin/volume-button volup
KEY_VOLUMEDOWN 1                         /usr/bin/volume-button voldown
KEY_VOLUMEUP 0                           /usr/bin/volume-button-release
KEY_VOLUMEDOWN 0                         /usr/bin/volume-button-release

# The G350 FN/Menu key is BTN_TRIGGER_HAPPY5 (Linux input code 708).
KEY_VOLUMEUP+BTN_TRIGGER_HAPPY5 1        /usr/bin/volume-button briup
KEY_VOLUMEDOWN+BTN_TRIGGER_HAPPY5 1      /usr/bin/volume-button bridown
KEY_VOLUMEUP+BTN_TRIGGER_HAPPY5 0        /usr/bin/volume-button-release
KEY_VOLUMEDOWN+BTN_TRIGGER_HAPPY5 0      /usr/bin/volume-button-release

KEY_POWER 1                              /usr/bin/power-button
KEY_POWER 0                              /usr/bin/power-button-release

